# Release
#
# Tag-triggered npm publish for the tiden-javascript workspaces: builds,
# tests, then publishes `commons` before `playwright` (which depends on it).
# Push a `vX.Y.Z` tag matching the versions already set in each package's
# package.json to publish.
#
# OIDC trusted publishing (no NPM_TOKEN secret): with `id-token: write`, npm
# exchanges this workflow's GitHub Actions OIDC token for a short-lived
# publish token and attaches provenance to each published package.
#
# Manual prerequisite (one-time, done by the npm `@tiden` scope owner): add
# this repo (qase-tms/tiden-javascript) as a Trusted Publisher for both
# @tiden/reporter-commons and @tiden/playwright-reporter under each package's
# npm "Trusted Publishers" settings, before the first tag push.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing + provenance

concurrency: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in commons playwright; do
            V=$(node -p "require('./$pkg/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$pkg is at version $V but the tag is v$TAG — bump package versions before tagging"
              exit 1
            fi
          done
      - run: npm run build -ws --if-present
      - run: npm run test -ws --if-present
      - run: npm publish -w commons --provenance --access public
      - run: npm publish -w playwright --provenance --access public
