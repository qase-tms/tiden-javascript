# Release
#
# Tag-triggered npm publish for the tiden-javascript workspaces: builds,
# tests, then publishes in dependency order — `api-client` (the generated
# OpenAPI client) first because `commons` now depends on it at runtime, then
# `commons`, then the framework reporters that depend on commons
# (`playwright`, `vitest`). @tiden/api-client can no longer be held back from
# a release: commons is unusable without it on the registry.
# Push a `vX.Y.Z` tag matching the versions already set in each package's
# package.json to publish.
#
# OIDC trusted publishing (no NPM_TOKEN secret): with `id-token: write`, npm
# exchanges this workflow's GitHub Actions OIDC token for a short-lived
# publish token and attaches provenance to each published package.
#
# Each package must have this repo configured as its Trusted Publisher on npm
# before its first OIDC release. npm can only configure that on a package that
# already exists, so a package published here for the very first time needs one
# token-based publish to create it; every release after that goes through this
# workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing + provenance

concurrency: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in commons playwright vitest api-client; do
            V=$(node -p "require('./$pkg/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$pkg is at version $V but the tag is v$TAG — bump package versions before tagging"
              exit 1
            fi
          done
      - run: npm run build -ws --if-present
      - run: npm run test -ws --if-present
      # Publish order follows the dependency graph: api-client is a runtime
      # dependency of commons (the JSON endpoints go through the generated
      # client), and commons is a runtime dependency of both reporters.
      - run: npm publish -w api-client --provenance --access public
      - run: npm publish -w commons --provenance --access public
      - run: npm publish -w playwright --provenance --access public
      - run: npm publish -w vitest --provenance --access public
